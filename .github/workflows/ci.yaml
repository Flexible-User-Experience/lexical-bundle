name: CI

on:
  push:
    branches: [main, devel]
  pull_request: ~

jobs:
  tests:
    name: "PHP ${{ matrix.php }} · Symfony ${{ matrix.symfony }} ${{ matrix.composer-flags }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', symfony: '7.4.*', composer-flags: '--prefer-lowest' }
          - { php: '8.3', symfony: '7.*' }
          - { php: '8.4', symfony: '8.*' }

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
          tools: composer:v2

      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      - name: Pin the Symfony version
        run: composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress ${{ matrix.composer-flags }}

      - name: Run tests
        run: vendor/bin/phpunit

  browser:
    name: "Browser tests (Panther, headless Chrome)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # The harness is a consumer of the bundle: this is `importmap:require` of the Lexical
      # packages at the constraint assets/package.json declares, downloaded from jsDelivr.
      - name: Build the browser harness
        run: php tests/Browser/Harness/build.php

      # ubuntu-latest ships Chrome and a matching chromedriver on the PATH, which Panther finds.
      - name: Run the browser suite
        run: vendor/bin/phpunit --testsuite browser

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: panther-screenshots
          path: var/panther/screenshots/
          if-no-files-found: ignore
